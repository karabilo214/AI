[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ramvi-service"
version = "0.1.0"
description = "Лёгкие контракты и координация модулей RAMVI"
requires-python = ">=3.12"
dependencies = ["ramvi-engine>=0.1.0", "ramvi-storage>=0.1.0"]

[project.optional-dependencies]
# 5.2 (ADR-0004): голосовой ввод — запись звука и whisper.cpp; без них сервис работает, голос недоступен.
voice = ["sounddevice==0.5.6", "pywhispercpp==1.5.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ramvi_service*"]
namespaces = false

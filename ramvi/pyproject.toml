# Общие инструменты разработки; сборка компонентов добавляется по мере переноса.
[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
    "setuptools==84.2.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "dist", "results", "models", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
exclude = [
    "engine/ramvi_engine/generation/head.py",
    "engine/ramvi_engine/core/engine.py",
    "engine/ramvi_engine/core/gengine.py",
    "engine/ramvi_engine/core/moe.py",
    "engine/ramvi_engine/core/reference.py",
    "engine/ramvi_engine/kernels/tkernels.py",
    "engine/ramvi_engine/kernels/wcomp.py",
    "engine/ramvi_engine/kernels/gkernels.py",
    "engine/ramvi_engine/kernels/vocab8.py",
    "engine/ramvi_engine/kernels/q4.py",
    "engine/ramvi_engine/kernels/prefill.py",
    "engine/ramvi_engine/kernels/prefill_kernels.py",
    "engine/ramvi_engine/cpu/cpu_layer.py",
    "engine/ramvi_engine/cpu/gcpu.py",
    "engine/ramvi_engine/formats/gguf.py",
    "engine/ramvi_engine/formats/model.py",
    "engine/ramvi_engine/formats/tokenizer_check.py",
    "engine/ramvi_engine/planning/plan.py",
    "engine/ramvi_engine/planning/tune.py",
    "engine/ramvi_engine/planning/measured_plan.py",
    "engine/ramvi_engine/generation/constrain.py",
    "engine/ramvi_engine/generation/grammar_worker.py",
    "engine/ramvi_engine/cli.py",
    "engine/ramvi_engine/native/write_manifest.py",
    "engine/tests/legacy/test_*.py",
    "engine/tests/legacy/audit_support.py",
    "engine/tools/bench/bench.py",
    "engine/tools/bench/bench_o02.py",
    "engine/tools/bench/bench_validation.py",
    "engine/tools/bench/bench_wide.py",
    "engine/tools/bench/compare_bench.py",
    "engine/tools/checks/api_test.py",
    "engine/tools/checks/check_audit_api.py",
    "engine/tools/checks/check_audit_gpu.py",
    "engine/tools/checks/check_audit_metadata.py",
    "engine/tools/checks/check_audit_moe_recovery.py",
    "engine/tools/checks/check_audit_recovery.py",
    "engine/tools/checks/check_audit_sampling.py",
    "engine/tools/checks/check_gcpu.py",
    "engine/tools/checks/check_gengine.py",
    "engine/tools/checks/check_gguf.py",
    "engine/tools/checks/check_gspec.py",
    "engine/tools/checks/check_measured_plan.py",
    "engine/tools/checks/check_pool.py",
    "engine/tools/checks/check_prefill.py",
    "engine/tools/checks/check_single_token.py",
    "engine/tools/checks/check_switch.py",
    "engine/tools/checks/native_pool.py",
    "engine/tools/checks/selftest.py",
]


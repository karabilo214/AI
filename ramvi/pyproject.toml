# Общие инструменты разработки; сборка компонентов добавляется по мере переноса.
[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "dist", "results", "models", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["tests"]

[tool.pytest.ini_options]
minversion = "9.2"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

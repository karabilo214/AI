[tool.mypy]
python_version = "3.12"
strict = true
follow_imports = "silent"
mypy_path = ["$MYPY_CONFIG_FILE_DIR/..", "$MYPY_CONFIG_FILE_DIR/engine"]
exclude = ["engine/tests/legacy/"]
warn_unused_configs = true
files = ["tests", "engine/tests", "engine/ramvi_engine/console.py", "engine/ramvi_engine/config.py", "engine/ramvi_engine/server", "engine/tools/bench/report_migration.py", "engine/tools/__main__.py", "engine/tools/processes.py", "engine/tests/legacy/conftest.py"]

[tool.pytest.ini_options]
minversion = "9.2"
testpaths = ["tests", "engine/tests"]
pythonpath = ["engine", ".."]
addopts = "-ra --strict-config --strict-markers"

# Диспетчер существует только в репозитории; его выбранные исходники проверяются
# как tools.*, а импортируемый путь ramvi.engine.tools.* не проверяется повторно.
[[tool.mypy.overrides]]
module = ["ramvi.engine.tools", "ramvi.engine.tools.*"]
follow_imports = "skip"

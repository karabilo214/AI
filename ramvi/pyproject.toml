# Общие инструменты разработки; сборка компонентов добавляется по мере переноса.
[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
    "setuptools==84.2.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "dist", "results", "models", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
exclude = [
    "engine/ramvi_engine/generation/head.py",
    "engine/ramvi_engine/core/engine.py",
    "engine/ramvi_engine/core/gengine.py",
    "engine/ramvi_engine/core/moe.py",
    "engine/ramvi_engine/core/reference.py",
    "engine/ramvi_engine/kernels/tkernels.py",
    "engine/ramvi_engine/kernels/wcomp.py",
    "engine/ramvi_engine/kernels/gkernels.py",
    "engine/ramvi_engine/kernels/vocab8.py",
    "engine/ramvi_engine/kernels/q4.py",
    "engine/ramvi_engine/kernels/prefill.py",
    "engine/ramvi_engine/kernels/prefill_kernels.py",
    "engine/ramvi_engine/cpu/cpu_layer.py",
    "engine/ramvi_engine/cpu/gcpu.py",
    "engine/ramvi_engine/formats/gguf.py",
    "engine/ramvi_engine/formats/model.py",
    "engine/ramvi_engine/formats/tokenizer_check.py",
    "engine/ramvi_engine/planning/plan.py",
    "engine/ramvi_engine/planning/tune.py",
    "engine/ramvi_engine/planning/measured_plan.py",
    "engine/ramvi_engine/generation/constrain.py",
    "engine/ramvi_engine/generation/grammar_worker.py",
    "engine/ramvi_engine/cli.py",
    "engine/ramvi_engine/native/write_manifest.py",
]

# Перенос старого кода без массового изменения стиля и хешей ядер.
[tool.ruff.lint.per-file-ignores]
"engine/ramvi_engine/generation/head.py" = ["E401", "E701", "E702", "E731", "E741", "F401", "F841", "I001", "UP", "B"]
"engine/ramvi_engine/core/engine.py" = ["E401", "E701", "E702", "E731", "E741", "F401", "F841", "I001", "UP", "B"]
